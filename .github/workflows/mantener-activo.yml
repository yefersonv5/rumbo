# Evita que Supabase pause el proyecto gratuito por inactividad (7 días).
# Llama a la función ping() dos veces por semana. No lee ni expone datos.
# Requiere dos secretos del repositorio (Settings > Secrets and variables > Actions):
#   SUPABASE_URL  y  SUPABASE_KEY  (la misma anon / publishable key de config.js)
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 13 * * 1,4'   # lunes y jueves, 8:17 a. m. hora Colombia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Llamar ping()
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.SUPABASE_URL }}/rest/v1/rpc/ping" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $code"
          test "$code" = "200"
