# Evita que Supabase pause el proyecto gratuito por inactividad (7 días).
# Llama a la función ping() dos veces por semana. No lee ni expone datos.
# Toma la URL y la llave pública (publishable) de config.js, que ya es público.
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 13 * * 1,4'   # lunes y jueves, 8:17 a. m. hora Colombia
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Llamar ping()
        run: |
          URL=$(grep -oP "supabaseUrl:\s*'\K[^']+" config.js)
          KEY=$(grep -oP "supabaseKey:\s*'\K[^']+" config.js)
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "Respuesta: $code"
          test "$code" = "200"
