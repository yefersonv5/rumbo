<meta name="theme-color" content="#0b1620" media="(prefers-color-scheme: dark)">

<body>
<div class="statusbar-cover" aria-hidden="true"></div>
<div id="app"></div>
<div id="modal-root"></div>
<div id="toast" class="toast" hidden></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js?v=20261021054501"></script>
<script src="plantillas.js?v=20261021054501"></script>
<script src="app.js?v=20261021054501"></script>
<script>
  if ('serviceWorker' in navigator && location.protocol === 'https:') {
    navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(r => {
      r.update();
      document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') r.update(); });
    }).catch(() => {});
    // Cuando llega una versión nueva, recarga una sola vez para usarla.
    let recargado = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (!recargado && navigator.serviceWorker.controller) { recargado = true; location.reload(); } });
  }
</script>
</body>
</html>
